name: Full Stack CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build and Push Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: vanshikajain46624/fullstack-backend:latest

      # Step 4: Build and Push Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: vanshikajain46624/fullstack-frontend:latest

      # Step 5: Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/fullstack-cicd
            cd /home/ubuntu/fullstack-cicd

            cat > docker-compose.yml <<'EOF'
            services:
              mongodb:
                image: mongo:7
                restart: unless-stopped
                volumes:
                  - mongodb_data:/data/db
                networks:
                  - app-network

              backend:
                image: vanshikajain46624/fullstack-backend:latest
                restart: unless-stopped
                environment:
                  PORT: "5000"
                  MONGO_URL: mongodb://mongodb:27017
                depends_on:
                  - mongodb
                networks:
                  - app-network

              frontend:
                image: vanshikajain46624/fullstack-frontend:latest
                restart: unless-stopped
                ports:
                  - "80:80"
                depends_on:
                  - backend
                networks:
                  - app-network

            volumes:
              mongodb_data:

            networks:
              app-network:
                driver: bridge
            EOF

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker compose ps
