services:
mongodb:
image: mongo:8
restart: unless-stopped
volumes:
- mongodb_data:/data/db
networks:
- app-network

backend:
build:
context: ./backend
restart: unless-stopped
environment:
PORT: "5000"
MONGO_URL: mongodb://mongodb:27017
depends_on:
- mongodb
networks:
- app-network

frontend:
build:
context: ./frontend
restart: unless-stopped
ports:
- "80:80"
depends_on:
- backend
networks:
- app-network

volumes:
mongodb_data:

networks:
app-network:
driver: bridge
